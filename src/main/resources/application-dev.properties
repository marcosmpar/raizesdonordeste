# Perfil padrão: H2 em arquivo (persistente, sem instalar nada), modo compatível com PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/raizes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Somente desenvolvimento: chave JWT fixa (em prod usar JWT_SECRET)
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
