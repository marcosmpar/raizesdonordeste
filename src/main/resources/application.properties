spring.application.name=raizesdonordeste

# Hospedagem: porta vinda do ambiente e suporte a proxy reverso (X-Forwarded-*) para o Swagger usar a URL pública
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Erros de binding/JSON tratados pelo handler global
spring.mvc.problemdetails.enabled=false

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
